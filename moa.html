    { name: "\uBB3C\uAC00\uC640 \uC778\uD50C\uB808\uC774\uC158", definition: "\uBB3C\uAC00\uB294 \uC5EC\uB7EC \uC0C1\uD488\uACFC \uC11C\uBE44\uC2A4 \uAC00\uACA9\uC758 \uC804\uBC18\uC801\uC778 \uC218\uC900\uC774\uC5D0\uC694. \uC778\uD50C\uB808\uC774\uC158\uC740 \uC774\uB7F0 \uC804\uBC18\uC801\uC778 \uBB3C\uAC00\uAC00 \uC9C0\uC18D\uC801\uC73C\uB85C \uC624\uB974\uB294 \uD604\uC0C1\uC774\uC5D0\uC694.", example: "\uAC04\uC2DD\uACFC \uAD50\uD1B5\uBE44, \uD559\uC6A9\uD488 \uB4F1 \uC5EC\uB7EC \uAC00\uACA9\uC774 \uC624\uB974\uBA74 \uAC19\uC740 \uC6A9\uB3C8\uC73C\uB85C \uC0B4 \uC218 \uC788\uB294 \uC591\uC774 \uC904\uC5B4\uB4E4 \uC218 \uC788\uC5B4\uC694.", confusion: "\uD55C \uC0C1\uD488\uC758 \uAC00\uACA9\uB9CC \uC624\uB978\uB2E4\uACE0 \uACE7\uBC14\uB85C \uC804\uCCB4 \uBB3C\uAC00\uAC00 \uC624\uB978 \uAC83\uC740 \uC544\uB2C8\uC5D0\uC694. \uBAA8\uB4E0 \uAC00\uACA9\uC774 \uB611\uAC19\uC740 \uC18D\uB3C4\uB85C \uC624\uB974\uB294 \uAC83\uB3C4 \uC544\uB2C8\uC5D0\uC694.", activity: "\uC18C\uBE44 \uC120\uD0DD \uC2E4\uD5D8\uC2E4\uC5D0\uC11C \uC800\uC7A5\uD55C \uC120\uD0DD\uC758 \uAC00\uACA9 \uBCC0\uD654 \uC2E4\uD5D8\uC744 \uD574 \uBCF4\uC138\uC694.", view: "lab", button: "\uAC00\uACA9 \uBCC0\uD654 \uC2E4\uD5D8\uD558\uAE30" },
    { name: "\uB3C8\uC758 \uC2E4\uC9C8 \uAC00\uCE58", definition: "\uC2E4\uC9C8 \uAC00\uCE58\uB294 \uB3C8\uC758 \uC22B\uC790\uBFD0 \uC544\uB2C8\uB77C \uADF8 \uB3C8\uC73C\uB85C \uC2E4\uC81C \uC5BC\uB9C8\uB098 \uC0B4 \uC218 \uC788\uB294\uC9C0\uB97C \uC0DD\uAC01\uD55C \uAC00\uCE58\uC608\uC694.", example: "\uC6A9\uB3C8\uC774 \uADF8\uB300\uB85C\uC778\uB370 \uD3C9\uC18C \uC0AC\uB358 \uBB3C\uAC74\uC758 \uAC00\uACA9\uC774 \uC624\uB974\uBA74 \uAC19\uC740 \uC6A9\uB3C8\uC73C\uB85C \uC0B4 \uC218 \uC788\uB294 \uC591\uC774 \uC904\uC5B4\uC694.", confusion: "\uB3C8\uC758 \uC561\uC218\uAC00 \uADF8\uB300\uB85C\uC5EC\uB3C4 \uC0B4 \uC218 \uC788\uB294 \uC591\uC740 \uBCC0\uD560 \uC218 \uC788\uC5B4\uC694. \uBAA8\uB4E0 \uBB3C\uAC74\uC758 \uAC00\uACA9\uC774 \uAC19\uC740 \uBE44\uC728\uB85C \uBC14\uB00C\uB294 \uAC83\uC740 \uC544\uB2C8\uC5D0\uC694.", activity: "\uAC00\uC0C1 \uC18C\uBE44 \uD65C\uB3D9\uC5D0\uC11C \uBB3C\uAC00\uAC00 \uC62C\uB790\uC744 \uB54C\uC758 \uC608\uC2DC \uACC4\uD68D\uC744 \uC0B4\uD3B4\uBCF4\uC138\uC694.", view: "activity", button: "\uAC19\uC740 \uC608\uC0B0\uC73C\uB85C \uACC4\uD68D\uD558\uAE30" },
    { name: "\uC218\uC694", definition: "\uC218\uC694\uB294 \uC0AC\uB78C\uB4E4\uC774 \uC5EC\uB7EC \uAC00\uACA9\uC5D0\uC11C \uBB3C\uAC74\uC744 \uC0AC\uACE0\uC790 \uD558\uBA74\uC11C \uC2E4\uC81C\uB85C \uC0B4 \uC218 \uC788\uB294 \uC591\uC758 \uAD00\uACC4\uC608\uC694.", example: "\uB2E4\uB978 \uC870\uAC74\uC774 \uAC19\uC744 \uB54C \uC88B\uC544\uD558\uB294 \uAC04\uC2DD\uC758 \uAC00\uACA9\uC774 \uB0AE\uC544\uC9C0\uBA74 \uB354 \uB9CE\uC774 \uC0AC\uACE0 \uC2F6\uC5B4\uC9C8 \uC218 \uC788\uC5B4\uC694.", confusion: "\uC6D0\uD558\uAE30\uB9CC \uD558\uACE0 \uC0B4 \uC218 \uC5C6\uB294 \uB9C8\uC74C\uACFC\uB294 \uB2EC\uB77C\uC694. \uAC00\uACA9\uBFD0 \uC544\uB2C8\uB77C \uC18C\uB4DD, \uCDE8\uD5A5 \uB4F1\uB3C4 \uC218\uC694\uC5D0 \uC601\uD5A5\uC744 \uC904 \uC218 \uC788\uC5B4\uC694.", activity: "\uC120\uD0DD \uC2E4\uD5D8\uC2E4\uC5D0\uC11C \uAC00\uACA9 \uBCC0\uD654\uC5D0 \uB530\uB77C \uC5B4\uB5A4 \uACC4\uD68D\uC774 \uAC00\uB2A5\uD55C\uC9C0 \uC0B4\uD3B4\uBCF4\uC138\uC694.", view: "lab", button: "\uAC00\uACA9\uACFC \uC120\uD0DD \uC0B4\uD3B4\uBCF4\uAE30" },
    { name: "\uACF5\uAE09", definition: "\uACF5\uAE09\uC740 \uD310\uB9E4\uC790\uAC00 \uC5EC\uB7EC \uAC00\uACA9\uC5D0\uC11C \uBB3C\uAC74\uC744 \uD314\uACE0\uC790 \uD558\uBA74\uC11C \uC2E4\uC81C\uB85C \uD314 \uC218 \uC788\uB294 \uC591\uC758 \uAD00\uACC4\uC608\uC694.", example: "\uB3D9\uB124 \uBE75\uC9D1\uC740 \uC7AC\uB8CC\uBE44\uC640 \uD310\uB9E4 \uAC00\uACA9\uC744 \uACE0\uB824\uD574 \uD558\uB8E8\uC5D0 \uB9CC\uB4E4 \uBE75\uC758 \uC591\uC744 \uC815\uD560 \uC218 \uC788\uC5B4\uC694.", confusion: "\uC9C4\uC5F4\uB41C \uBB3C\uAC74\uC758 \uC591\uB9CC \uB73B\uD558\uB294 \uAC83\uC740 \uC544\uB2C8\uC5D0\uC694. \uC7AC\uB8CC\uBE44, \uAE30\uC220\uACFC \uD310\uB9E4\uC790 \uC218 \uB4F1\uC774 \uACF5\uAE09\uC5D0 \uC601\uD5A5\uC744 \uC904 \uC218 \uC788\uC5B4\uC694.", activity: "\uAC00\uC0C1 \uC18C\uBE44 \uD65C\uB3D9\uC5D0\uC11C \uC5EC\uB7EC \uD56D\uBAA9\uC744 \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.", view: "activity", button: "\uC0C1\uD488 \uC120\uD0DD \uC5F0\uC2B5\uD558\uAE30" },
    { name: "\uC2DC\uC7A5 \uAC00\uACA9", definition: "\uC2DC\uC7A5\uC5D0\uC11C\uB294 \uC0AC\uACE0 \uC2F6\uC740 \uC0AC\uB78C\uACFC \uD314\uACE0 \uC2F6\uC740 \uC0AC\uB78C\uC758 \uC120\uD0DD\uC774 \uB9CC\uB098 \uAC00\uACA9\uC774 \uD615\uC131\uB3FC\uC694.", example: "\uAC19\uC740 \uBE75\uC774\uB77C\uB3C4 \uCC3E\uB294 \uC0AC\uB78C\uC774 \uB9CE\uC544\uC9C0\uAC70\uB098 \uC7AC\uB8CC \uACF5\uAE09\uC774 \uC904\uBA74 \uAC00\uACA9\uC774 \uB2EC\uB77C\uC9C8 \uC218 \uC788\uC5B4\uC694.", confusion: "\uAC00\uACA9\uC774 \uC6C0\uC9C1\uC774\uB294 \uC774\uC720\uB97C \uC218\uC694 \uD558\uB098\uB9CC\uC73C\uB85C \uB2E8\uC815\uD558\uAE30 \uC5B4\uB824\uC6CC\uC694. \uC0DD\uC0B0\uBE44\uC640 \uACF5\uAE09, \uACBD\uC7C1 \uB4F1 \uC5EC\uB7EC \uC870\uAC74\uC774 \uC601\uD5A5\uC744 \uC904 \uC218 \uC788\uC5B4\uC694.", activity: "\uAC00\uACA9 \uBCC0\uD654 \uC2E4\uD5D8\uC5D0\uC11C \uAC00\uACA9\uC774 \uB2EC\uB77C\uC84C\uC744 \uB54C \uC608\uC0B0 \uC548\uC758 \uC120\uD0DD\uC744 \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.", view: "lab", button: "\uB2EC\uB77C\uC9C4 \uAC00\uACA9 \uBE44\uAD50\uD558\uAE30" },
    { name: "\uB2E8\uC704 \uAC00\uACA9", definition: "\uB2E8\uC704 \uAC00\uACA9\uC740 \uBB3C\uAC74\uC758 \uAC00\uACA9\uC744 \uBB34\uAC8C, \uAC1C\uC218 \uB610\uB294 \uC6A9\uB7C9\uC73C\uB85C \uB098\uB208 \uAC12\uC774\uC5D0\uC694. \uAC19\uC740 \uB2E8\uC704\uB85C \uBE44\uAD50\uD558\uBA74 \uC591\uC5D0 \uB530\uB978 \uCC28\uC774\uB97C \uC0B4\uD3B4\uBCFC \uC218 \uC788\uC5B4\uC694.", example: "\uACFC\uC790 100g\uC774 2,000\uC6D0\uC774\uACE0 200g\uC774 3,000\uC6D0\uC774\uBA74 100g\uB2F9 \uAC00\uACA9\uC740 \uAC01\uAC01 2,000\uC6D0\uACFC 1,500\uC6D0\uC774\uC5D0\uC694.", confusion: "\uB2E8\uC704 \uAC00\uACA9\uC774 \uB0AE\uC740 \uD070 \uBB36\uC74C\uC774 \uD56D\uC0C1 \uC88B\uC740 \uC120\uD0DD\uC740 \uC544\uB2C8\uC5D0\uC694. \uD544\uC694\uD55C \uC591\uACFC \uC720\uD1B5\uAE30\uD55C, \uC2E4\uC81C\uB85C \uC4F8 \uC218 \uC788\uB294 \uC608\uC0B0\uB3C4 \uC0DD\uAC01\uD574\uC57C \uD574\uC694.", activity: "\uB450 \uAC00\uC9C0 \uD06C\uAE30\uB97C \uAC01\uAC01 \uC120\uD0DD\uC548\uC73C\uB85C \uC801\uACE0 \uAC00\uACA9\uACFC \uD544\uC694\uD55C \uC591\uC744 \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.", view: "lab", button: "\uAD6C\uB9E4 \uACC4\uD68D \uBE44\uAD50\uD558\uAE30" },
    { name: "\uD560\uC778\uACFC \uCD5C\uC885 \uAC00\uACA9", definition: "\uD560\uC778\uC740 \uC6D0\uB798 \uAC00\uACA9\uC5D0\uC11C \uC77C\uC815 \uAE08\uC561\uC774\uB098 \uBE44\uC728\uC744 \uBE7C\uB294 \uAC83\uC774\uC5D0\uC694. \uC2E4\uC81C\uB85C \uB0B4\uC57C \uD558\uB294 \uCD5C\uC885 \uAE08\uC561\uC744 \uD655\uC778\uD558\uB294 \uAC8C \uC911\uC694\uD574\uC694.", example: "10,000\uC6D0\uC9DC\uB9AC \uBB3C\uAC74\uC744 20% \uD560\uC778\uD558\uBA74 2,000\uC6D0\uC744 \uBE7C\uC11C 8,000\uC6D0\uC774\uC5D0\uC694.", confusion: "\uD560\uC778\uC728\uC774 \uB192\uC544\uB3C4 \uD544\uC694\uD558\uC9C0 \uC54A\uC73C\uBA74 \uC18C\uBE44 \uAE08\uC561\uC774 \uB298\uC5B4\uB0A0 \uC218 \uC788\uC5B4\uC694. \uBC30\uC1A1\uBE44\uB098 \uD560\uC778 \uC870\uAC74\uB3C4 \uCD5C\uC885 \uAE08\uC561\uC5D0 \uC601\uD5A5\uC744 \uC904 \uC218 \uC788\uC5B4\uC694.", activity: "\uC18C\uBE44 \uC120\uD0DD \uC2E4\uD5D8\uC2E4\uC5D0 \uD560\uC778 \uD6C4 \uC2E4\uC81C\uB85C \uB0BC \uAE08\uC561\uC744 \uC801\uACE0 \uB2E4\uB978 \uC120\uD0DD\uACFC \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.", view: "lab", button: "\uCD5C\uC885 \uAE08\uC561 \uBE44\uAD50\uD558\uAE30" },
    { name: "\uC774\uC790\uC640 \uAE08\uB9AC", definition: "\uC774\uC790\uB294 \uB3C8\uC744 \uB9E1\uAE30\uAC70\uB098 \uBE4C\uB9B4 \uB54C \uC57D\uC18D\uC5D0 \uB530\uB77C \uB354\uD574\uC9C0\uB294 \uB3C8\uC774\uACE0, \uAE08\uB9AC\uB294 \uADF8 \uC774\uC790\uC758 \uBE44\uC728\uC774\uC5D0\uC694.", example: "10,000\uC6D0\uC744 \uC5F0 2%\uC758 \uB2E8\uB9AC\uB85C 1\uB144 \uB9E1\uAE30\uBA74 \uC138\uAE08 \uB4F1\uC744 \uC81C\uC678\uD558\uAE30 \uC804 \uC774\uC790\uB294 200\uC6D0\uC774\uC5D0\uC694.", confusion: "\uAE08\uB9AC\uAC00 \uAC19\uC544\uB3C4 \uAE30\uAC04\uACFC \uACC4\uC0B0 \uBC29\uC2DD, \uC138\uAE08\uC774\uB098 \uC218\uC218\uB8CC\uC5D0 \uB530\uB77C \uC2E4\uC81C \uBC1B\uAC70\uB098 \uB0BC \uAE08\uC561\uC740 \uB2EC\uB77C\uC9C8 \uC218 \uC788\uC5B4\uC694.", activity: "\uC800\uCD95 \uBAA9\uD45C\uB97C \uB9CC\uB4E4\uACE0 \uC5B8\uC81C\uAE4C\uC9C0 \uC5BC\uB9C8\uB97C \uBAA8\uC744\uC9C0 \uACC4\uD68D\uD574 \uBCF4\uC138\uC694. \uBAA8\uC544\uB294 \uC774\uC790\uB97C \uC790\uB3D9 \uACC4\uC0B0\uD558\uC9C0 \uC54A\uC544\uC694.", view: "goals", button: "\uC800\uCD95 \uBAA9\uD45C \uC138\uC6B0\uAE30" },
    { name: "\uBCF5\uB9AC", definition: "\uBCF5\uB9AC\uB294 \uC774\uC790\uAC00 \uC6D0\uAE08\uC5D0 \uB354\uD574\uC9C4 \uB4A4, \uB2E4\uC74C \uAE30\uAC04\uC5D0\uB294 \uB354\uD574\uC9C4 \uC774\uC790\uC5D0\uB3C4 \uB2E4\uC2DC \uC774\uC790\uAC00 \uBD99\uB294 \uBC29\uC2DD\uC774\uC5D0\uC694.", example: "10,000\uC6D0\uC5D0 \uC5F0 10%\uAC00 1\uB144\uB9C8\uB2E4 \uBCF5\uB9AC\uB85C \uBD99\uB294\uB2E4\uBA74 \uC138\uAE08 \uB4F1\uC744 \uC81C\uC678\uD558\uAE30 \uC804 1\uB144 \uD6C4 11,000\uC6D0, 2\uB144 \uD6C4 12,100\uC6D0\uC774\uC5D0\uC694.", confusion: "\uBCF5\uB9AC\uAC00 \uC5B8\uC81C\uB098 \uD070 \uC218\uC775\uC744 \uBCF4\uC7A5\uD558\uB294 \uAC83\uC740 \uC544\uB2C8\uC5D0\uC694. \uAE08\uB9AC, \uAE30\uAC04, \uC218\uC218\uB8CC\uC640 \uC138\uAE08 \uB4F1\uC5D0 \uB530\uB77C \uC2E4\uC81C \uACB0\uACFC\uB294 \uB2EC\uB77C\uC838\uC694.", activity: "\uC800\uCD95 \uBAA9\uD45C\uC5D0\uC11C \uAE30\uAC04\uACFC \uBAA9\uD45C \uAE08\uC561\uC744 \uC815\uD574 \uBCF4\uC138\uC694. \uBAA8\uC544\uC5D0\uB294 \uBCF5\uB9AC \uC790\uB3D9 \uACC4\uC0B0 \uAE30\uB2A5\uC774 \uC5C6\uC5B4\uC694.", view: "goals", button: "\uC800\uCD95 \uACC4\uD68D \uC0B4\uD3B4\uBCF4\uAE30" },
    { name: "\uC2E0\uC6A9\uACFC \uBD80\uCC44", definition: "\uC2E0\uC6A9\uC740 \uB3C8\uC744 \uBE4C\uB9AC\uACE0 \uC57D\uC18D\uB300\uB85C \uAC1A\uC744 \uC218 \uC788\uB2E4\uACE0 \uC2E0\uB8B0\uBC1B\uB294 \uAC83\uC774\uACE0, \uBD80\uCC44\uB294 \uAC1A\uC544\uC57C \uD560 \uB3C8\uC774\uC5D0\uC694.", example: "\uB3C8\uC744 \uBE4C\uB824 10,000\uC6D0\uC9DC\uB9AC \uBB3C\uAC74\uC744 \uC0AC\uBA74 \uB2F9\uC7A5 \uB3C8\uC744 \uB0BC \uC218 \uC788\uC9C0\uB9CC \uB098\uC911\uC5D0 \uBE4C\uB9B0 \uB3C8\uACFC \uC57D\uC18D\uD55C \uBE44\uC6A9\uC744 \uAC1A\uC544\uC57C \uD574\uC694.", confusion: "\uBE4C\uB9B0 \uB3C8\uC740 \uC0C8\uB85C \uC0DD\uAE34 \uB0B4 \uC18C\uB4DD\uC774 \uC544\uB2C8\uC5D0\uC694. \uC774\uC790\uC640 \uC0C1\uD658\uC77C\uC744 \uC0B4\uD3B4\uBCF4\uC544\uC57C \uD574\uC694.", activity: "\uC18C\uBE44 \uC120\uD0DD \uC2E4\uD5D8\uC2E4\uC5D0\uC11C \uD604\uC7AC \uAC00\uC9C4 \uC608\uC0B0 \uC548\uC758 \uC120\uD0DD\uACFC \uD3EC\uAE30\uD560 \uB300\uC548\uC744 \uBE44\uAD50\uD574 \uBCF4\uC138\uC694.", view: "lab", button: "\uC608\uC0B0 \uC548\uC758 \uC120\uD0DD \uBE44\uAD50\uD558\uAE30" },

    const ctx = context(), menu = studentMenu, title = [...studentMenu, ["settings", "\uB370\uC774\uD130 \uAD00\uB9AC"]].find((x) => x[0] === state.view)?.[1] || "\uBAA8\uC544", isMonthly = ["dashboard", "transactions", "budgets"].includes(state.view), store = stores[state.dataset];
    document.title = `\uBAA8\uC544 (MOA) \xB7 ${title}`;
    document.querySelector("#app").innerHTML = `<div class="overlay ${state.menuOpen ? "open" : ""}" data-close-menu></div><aside class="sidebar ${state.menuOpen ? "open" : ""}" id="sidebar"><a class="brand" href="#" aria-label="\uBAA8\uC544 (MOA) \uCCAB \uD654\uBA74"><span class="brand-logo"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M13 45V32c0-8 12-8 12 0v13m0-10V23c0-8 12-8 12 0v22m0-13c0-8 12-8 12 0v13" stroke="#e3efc6" stroke-width="5.5" stroke-linecap="round"/></svg></span><span><span class="brand-name">\uBAA8\uC544 <span class="brand-english" lang="en">(MOA)</span></span><span class="brand-caption" style="display:block">\uB098\uC758 \uC791\uC740 \uACBD\uC81C \uC0DD\uD65C</span></span></a><div class="nav-label">\uB098\uC758 \uC6A9\uB3C8 \uB178\uD2B8</div><nav class="nav" aria-label="\uBA54\uB274">${menu.map(([id, name, ico]) => `<button data-view="${id}" class="${state.view === id ? "active" : ""}" ${state.view === id ? 'aria-current="page"' : ""}>${icon(ico)}${name}</button>`).join("")}</nav><div class="sidebar-bottom"><div class="sidebar-note">${icon("leaf")}<strong>\uC870\uAE08\uC529 \uBAA8\uC544, \uB354 \uB098\uC740 \uB0B4\uC77C</strong><p>\uC624\uB298\uC758 \uAE30\uB85D\uC774 \uB0B4\uC77C\uC758<br>\uD604\uBA85\uD55C \uC120\uD0DD\uC774 \uB420 \uAC70\uC608\uC694.</p></div><button class="sidebar-settings" data-view="settings" ${state.view === "settings" ? 'aria-current="page"' : ""}>${icon("settings")} \uB370\uC774\uD130 \uAD00\uB9AC</button><p class="micro muted" style="font-size:9px;padding:5px 14px">\uC774 \uBE0C\uB77C\uC6B0\uC800\uC5D0\uB9CC \uAE30\uB85D\uD574\uC694.</p></div></aside><div class="app-shell"><header class="topbar"><div class="topbar-left"><button class="icon-btn menu-toggle" aria-label="\uBA54\uB274 \uC5F4\uAE30" aria-expanded="${state.menuOpen}" aria-controls="sidebar">${icon("menu")}</button><div class="breadcrumb"><span>\uB098\uC758 \uACBD\uC81C \uC0DD\uD65C</span>${icon("chevron")}<strong>${title}</strong></div></div><div class="topbar-right"><div class="data-switch" role="group" aria-label="\uD604\uC7AC \uB370\uC774\uD130 \uC120\uD0DD"><button data-dataset="real" class="${state.dataset === "real" ? "active" : ""}" aria-pressed="${state.dataset === "real"}">\uC2E4\uC81C \uAE30\uB85D</button><button data-dataset="demo" class="${state.dataset === "demo" ? "active" : ""}" aria-pressed="${state.dataset === "demo"}">\uCCB4\uD5D8 \uB370\uC774\uD130</button></div></div></header><div class="data-notice ${state.dataset === "real" ? "real" : ""}"><span><span class="dot"></span><strong>${state.dataset === "demo" ? "\uCCB4\uD5D8 \uB370\uC774\uD130\uB97C \uB458\uB7EC\uBCF4\uACE0 \uC788\uC5B4\uC694" : "\uC2E4\uC81C \uAE30\uB85D\uC744 \uBCF4\uACE0 \uC788\uC5B4\uC694"}</strong><span class="notice-long"> \xB7 ${state.dataset === "demo" ? "\uC2E4\uC81C \uAE30\uB85D\uACFC \uBCC4\uB3C4\uB85C \uC800\uC7A5\uB3FC\uC694." : "\uC774 \uAE30\uAE30\uC758 \uBE0C\uB77C\uC6B0\uC800\uC5D0\uB9CC \uC800\uC7A5\uB3FC\uC694."}</span></span><button ${state.dataset === "demo" ? 'data-dataset="real"' : 'data-view="settings"'}>${state.dataset === "demo" ? "\uB0B4 \uAE30\uB85D \uC2DC\uC791\uD558\uAE30 \u2192" : "\uBC31\uC5C5\xB7\uB370\uC774\uD130 \uAD00\uB9AC \u2192"}</button></div><main class="content" id="main" tabindex="-1"><div class="page-head"><div><h1>${title}</h1><p>${subtitles[state.view]}</p></div><div class="row">${isMonthly ? `<div class="month-picker"><button class="icon-btn" aria-label="\uC774\uC804 \uB2EC" data-month="prev">${icon("left")}</button><input type="text" inputmode="numeric" id="selected-month" value="${state.month}" maxlength="7" pattern="[0-9]{4}-[0-9]{2}" aria-label="\uC870\uD68C \uC6D4 (\uC5F0\uB3C4-\uC6D4, \uC608: 2026-10)" title="\uC5F0\uB3C4-\uC6D4 \uD615\uC2DD\uC73C\uB85C \uC785\uB825\uD558\uC138\uC694. \uC608: 2026-10"><button class="icon-btn" aria-label="\uB2E4\uC74C \uB2EC" data-month="next">${icon("chevron")}</button></div>` : ""}${["dashboard", "transactions"].includes(state.view) ? `<button class="btn primary" data-action="add-transaction">${icon("plus")} \uAE30\uB85D\uD558\uAE30</button>` : state.view === "goals" ? `<button class="btn primary" data-action="add-goal">${icon("plus")} \uBAA9\uD45C \uB9CC\uB4E4\uAE30</button>` : ""}</div></div>${store.blocked ? `<div class="notice danger" role="alert">${e(store.message)} <button class="btn text" data-view="settings">\uB370\uC774\uD130 \uAD00\uB9AC \uC5F4\uAE30</button></div>` : ""}<div id="view-content">${views[state.view].render(ctx)}</div><footer class="footer-note">\uC791\uC740 \uC120\uD0DD\uC744 \uBAA8\uC544, \uB098\uB9CC\uC758 \uACBD\uC81C \uC0DD\uD65C \xB7 \uBAA8\uC544</footer></main></div>`;
    const app = document.querySelector("#app");
    app.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => navigate(b.dataset.view));
    app.querySelector(".brand").onclick = (ev) => {
      ev.preventDefault();
      navigate("dashboard");
    };
    app.querySelectorAll("[data-dataset]").forEach((b) => b.onclick = () => {
      if (state.dataset === b.dataset.dataset) return;
      state.dataset = b.dataset.dataset;
      clearDrafts();
      state.menuOpen = false;
      remember();
      render8();
      toast(state.dataset === "real" ? "\uC2E4\uC81C \uAE30\uB85D\uC73C\uB85C \uC804\uD658\uD588\uC5B4\uC694." : "\uCCB4\uD5D8 \uB370\uC774\uD130\uB85C \uC804\uD658\uD588\uC5B4\uC694.");
    });
    app.querySelector(".menu-toggle").onclick = () => {
      state.menuOpen = !state.menuOpen;
      updateMenu();
      if (state.menuOpen) app.querySelector(".nav button").focus();
    };
    app.querySelector("[data-close-menu]").onclick = () => {
      state.menuOpen = false;
      updateMenu();
    };
    app.querySelector("#selected-month")?.addEventListener("change", (ev) => changeMonth(ev.target.value));
    app.querySelector("#selected-month")?.addEventListener("input", (ev) => {
      if (validMonth(ev.target.value)) changeMonth(ev.target.value);
    });
    app.querySelectorAll("[data-month]").forEach((b) => b.onclick = () => changeMonth(b.dataset.month === "prev" ? previousMonth(state.month) : nextMonth(state.month)));
    app.querySelectorAll('[data-action="add-transaction"]').forEach((b) => b.onclick = () => transactionEditor(ctx));
    app.querySelectorAll('[data-action="add-goal"]').forEach((b) => b.onclick = () => goalEditor(ctx));
    views[state.view].bind?.(ctx, app.querySelector("#view-content"));
    updateMenu();
  }
  function updateMenu() {
    const sidebar = document.querySelector("#sidebar"), mobile = window.matchMedia("(max-width:760px)").matches;
    sidebar.classList.toggle("open", state.menuOpen);
    document.querySelector(".overlay").classList.toggle("open", state.menuOpen);
    sidebar.inert = mobile && !state.menuOpen;
    document.querySelector(".menu-toggle").setAttribute("aria-expanded", String(state.menuOpen));
  }
  window.addEventListener("resize", updateMenu);
  document.querySelector("#dialog").addEventListener("close", (ev) => {
    if (!ev.target.open) ev.target.replaceChildren();
  });
  document.querySelector("#dialog").addEventListener("keydown", (ev) => {
    if (ev.key !== "Tab") return;
    const controls = [...ev.currentTarget.querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), a[href]")].filter((el) => el.getClientRects().length);
    const first = controls[0], last = controls.at(-1);
    if (ev.shiftKey && document.activeElement === first) {
      ev.preventDefault();
      last?.focus();
    }
    if (!ev.shiftKey && document.activeElement === last) {
      ev.preventDefault();
      first?.focus();
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && state.menuOpen) {
      state.menuOpen = false;
      updateMenu();
      document.querySelector(".menu-toggle").focus();
    }
  });
  window.addEventListener("storage", (event) => {
    if (event.key === storageKey(state.dataset) || event.key === null) toast("\uB2E4\uB978 \uD0ED\uC5D0\uC11C \uC800\uC7A5\uB41C \uB370\uC774\uD130\uAC00 \uBC14\uB00C\uC5C8\uC5B4\uC694. \uB370\uC774\uD130 \uAD00\uB9AC\uC5D0\uC11C \uB2E4\uC2DC \uBD88\uB7EC\uC640 \uC8FC\uC138\uC694.", true);
  });
  render8();
})();
</script>
</body>
</html>
